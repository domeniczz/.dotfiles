[[mgr.prepend_keymap]]
on = [ "k" ]
run = "arrow -1"
desc = "Previous file"

[[mgr.prepend_keymap]]
on = [ "j" ]
run = "arrow 1"
desc = "Next file"

[[mgr.prepend_keymap]]
on = [ "<Up>" ]
run = "arrow -1"
desc = "Previous file"

[[mgr.prepend_keymap]]
on = [ "<Down>" ]
run = "arrow 1"
desc = "Next file"

[[mgr.prepend_keymap]]
on = [ "l" ]
run = "plugin smart-enter"
desc = "Enter directory or open file"
